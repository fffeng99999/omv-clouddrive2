version: "1.0"
type: component
data:
  name: omv-services-clouddrive2-form-page
  type: formPage
  config:
    request:
      service: CloudDrive2
      get:
        method: get
        transform:
          statusText: "{{ statusText | translate }}"
          updateStatusText: "{{ updateStatusText | translate }}"
      post:
        method: set
    hints:
      - type: info
        text: _("The CloudDrive2 web interface listens on port 19798. After enabling the service, click Save and then Apply to start it. Use the Start/Stop/Restart buttons for immediate control.")
        dismissible: true
        stateId: 5b1f2c34-9a76-4c11-8d2e-7f3a1c0b9e44
    fields:
      - type: divider
        title: _("Status")
      - type: textInput
        name: statusText
        label: _("Service status")
        hint: _("Running means the CloudDrive2 service is active on this machine.")
        readonly: true
      - type: textInput
        name: version
        label: _("CloudDrive2 version")
        readonly: true
      - type: textInput
        name: port
        label: _("Web interface port")
        value: 19798
        readonly: true
      - type: textInput
        name: updateStatusText
        label: _("Update status")
        hint: _("Click 'Check for updates' to query the upstream GitHub releases.")
        readonly: true
      - type: textInput
        name: updateLatest
        label: _("Latest version")
        readonly: true
      - type: divider
        title: _("Settings")
      - type: checkbox
        name: enable
        label: _("Enabled")
        hint: _("Start the CloudDrive2 service automatically at boot. Click Save and then Apply to take effect.")
        value: false
      - type: textInput
        name: configdir
        label: _("Configuration directory")
        hint: _("The directory where CloudDrive2 stores its configuration and data (CLOUDDRIVE_HOME). It must be located on a mounted filesystem.")
        value: "/var/lib/clouddrive2"
        validators:
          required: true
      - type: select
        name: channel
        label: _("Update channel")
        hint: _("The upstream release channel used when checking for updates and updating CloudDrive2.")
        value: "stable"
        store:
          data:
            - - "stable"
              - _("Stable (official releases)")
            - - "preview"
              - _("Preview (beta releases)")
    buttons:
      - text: _("Start")
        execute:
          type: request
          request:
            service: CloudDrive2
            method: start
            successNotification: _("CloudDrive2 service started.")
      - text: _("Stop")
        execute:
          type: request
          request:
            service: CloudDrive2
            method: stop
            successNotification: _("CloudDrive2 service stopped.")
      - text: _("Restart")
        confirmationDialogConfig:
          template: confirmation
          message: _("Do you really want to restart the CloudDrive2 service?")
        execute:
          type: request
          request:
            service: CloudDrive2
            method: restart
            successNotification: _("CloudDrive2 service restarted.")
      - text: _("Check for updates")
        execute:
          type: request
          request:
            service: CloudDrive2
            method: checkUpdate
            params:
              channel: "{{ channel }}"
            progressMessage: _("Checking for updates ...")
            successNotification: _("Update check finished. See the update status below.")
            reloadDataOnSuccess: true
      - text: _("Update")
        confirmationDialogConfig:
          template: confirmation
          message: _("Do you really want to download the latest CloudDrive2 release for the selected channel and restart the service? Your CloudDrive2 configuration and data are kept.")
        execute:
          type: taskDialog
          taskDialog:
            config:
              title: _("Updating CloudDrive2")
              startOnInit: true
              request:
                service: CloudDrive2
                method: update
                params:
                  channel: "{{ channel }}"
      - text: _("Open UI")
        execute:
          type: url
          url: "/externalRedirect/{{ ['http://', location() | get('hostname'), ':19798'] | join | encodeuricomponent }}"
      - template: cancel
        execute:
          type: url
          url: "/services"
      - template: submit
